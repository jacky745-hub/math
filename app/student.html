<!doctype html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小安作答</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<style>
  body { margin: 0; background: var(--surface); color: var(--ink); font: 400 16px/26px var(--font-sans); }
  .wrap { max-width: 560px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-12); }
  .head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); }
  .opt { display: flex; gap: var(--space-3); align-items: center; width: 100%; text-align: left; padding: var(--space-4); margin-bottom: var(--space-3);
    border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface-raised); font: 500 18px/26px var(--font-sans); cursor: pointer; color: var(--ink); }
  .opt b { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: var(--radius-pill); background: var(--surface-sunken); }
  .opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
  .opt[aria-pressed="true"] b { background: var(--brand); color: var(--on-brand); }
  .opt:focus-visible, textarea:focus-visible, .xa-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 120px; border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: var(--space-3);
    font: 400 17px/26px var(--font-sans); background: var(--surface-raised); color: var(--ink); }
  .send { width: 100%; justify-content: center; padding: var(--space-4); font-size: 17px; margin-top: var(--space-3); }
  .done { text-align: center; padding: var(--space-8) 0; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="js/relay.js" defer></script>
<script>
(function () {
  window.XA = window.XA || {};
  var app = document.getElementById("app");
  function h(t, p) { var e = document.createElement(t); p = p || {}; for (var k in p) { if (k === "class") e.className = p[k]; else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), p[k]); else e.setAttribute(k, p[k]); }
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c == null) continue; e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); } return e; }
  function decode(str) { str = str.replace(/-/g, "+").replace(/_/g, "/"); while (str.length % 4) str += "="; return JSON.parse(decodeURIComponent(escape(atob(str)))); }
  function sid() { try { var v = localStorage.getItem("xa.sid"); if (!v) { v = Math.random().toString(36).slice(2, 10); localStorage.setItem("xa.sid", v); } return v; } catch (e) { return Math.random().toString(36).slice(2, 10); } }
  var q;
  try { q = decode(location.hash.slice(1)); } catch (e) { q = null; }
  if (!q || !q.c) { app.appendChild(h("p", null, "找不到題目。請重新掃描老師螢幕上的 QR Code。")); return; }
  var type = q.t, picked = [];
  var TYPE = { single: "單選題", multi: "多選題", open: "觀念思考題" };
  app.appendChild(h("div", { class: "head" }, h("span", { class: "xa-badge xa-badge-brand" }, TYPE[type] || "題目"), h("span", { class: "xa-code" }, q.c)));
  app.appendChild(h("p", { class: "xa-question", style: "margin:0 0 16px" }, q.s));
  var box = h("div"); app.appendChild(box);
  var text;
  if (type === "open") { text = h("textarea", { maxlength: "80", placeholder: "寫下你的想法（80 字以內，不要寫名字）", "aria-label": "你的回答" }); box.appendChild(text); }
  else q.o.forEach(function (o) {
    var b = h("button", { class: "opt", type: "button", "aria-pressed": "false", onclick: function () {
      if (type === "single") { picked = [o[0]]; box.querySelectorAll(".opt").forEach(function (x) { x.setAttribute("aria-pressed", "false"); }); b.setAttribute("aria-pressed", "true"); }
      else { var i = picked.indexOf(o[0]); if (i >= 0) picked.splice(i, 1); else picked.push(o[0]); b.setAttribute("aria-pressed", i >= 0 ? "false" : "true"); }
    } }, h("b", null, o[0]), o[1]);
    box.appendChild(b);
  });
  var msg = h("p", { class: "xa-caption", role: "status", style: "margin-top:12px" });
  var send = h("button", { class: "xa-btn xa-btn-primary send", type: "button", onclick: function () {
    var answer = type === "open" ? text.value.trim() : (type === "single" ? picked[0] : picked);
    if (!answer || (Array.isArray(answer) && !answer.length)) { msg.textContent = type === "open" ? "請先寫下你的想法。" : "請先選一個答案。"; return; }
    send.disabled = true; msg.textContent = "送出中…";
    XA.relay.send({ kind: "answer", code: q.c, sid: sid(), answer: answer }, q.r || null).then(function (via) {
      app.innerHTML = "";
      app.appendChild(h("div", { class: "done" }, h("p", { class: "xa-title" }, "已送出，謝謝你！"),
        h("p", { class: "xa-caption" }, via.indexOf("relay") >= 0 || via.indexOf("local") >= 0 ? "請看老師的螢幕，小安會整理大家的答案。" : "")));
    }).catch(function (e) { send.disabled = false; msg.textContent = "送出失敗，請再按一次。（" + e.message + "）"; });
  } }, "送出答案");
  app.appendChild(send); app.appendChild(msg);
  if (!q.r) app.appendChild(h("p", { class: "xa-caption", style: "margin-top:24px" }, "提醒：這題只接受同一台電腦上的作答（老師尚未開啟跨裝置作答）。"));
})();
</script>
</body>
</html>
