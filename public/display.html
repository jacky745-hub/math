<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>即時文字雲 - 展示</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    box-sizing: border-box;
  }
  h1 { font-size: 18px; font-weight: 500; color: #94a3b8; margin: 0 0 24px; }
  #cloud {
    max-width: 900px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px 20px;
  }
  .tag {
    line-height: 1.2;
    font-weight: 700;
    white-space: nowrap;
    transition: font-size 0.3s ease;
  }
  #empty { color: #64748b; font-size: 14px; }
</style>
</head>
<body>
  <h1>即時文字雲</h1>
  <div id="cloud"></div>
  <div id="empty" hidden>等待第一筆投稿…</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const cloudEl = document.getElementById("cloud");
    const emptyEl = document.getElementById("empty");

    const PALETTE = ["#60a5fa", "#34d399", "#fbbf24", "#f472b6", "#a78bfa", "#38bdf8"];

    onSnapshot(collection(db, "wordcloud_words"), (snapshot) => {
      const counts = new Map();
      snapshot.forEach((doc) => {
        const word = (doc.data().word || "").trim();
        if (!word) return;
        counts.set(word, (counts.get(word) || 0) + 1);
      });

      cloudEl.innerHTML = "";
      emptyEl.hidden = counts.size > 0;
      if (counts.size === 0) return;

      const maxCount = Math.max(...counts.values());
      const minCount = Math.min(...counts.values());
      const entries = [...counts.entries()].sort((a, b) => b[1] - a[1]);

      entries.forEach(([word, count], i) => {
        const span = document.createElement("span");
        span.className = "tag";
        const ratio = maxCount === minCount ? 1 : (count - minCount) / (maxCount - minCount);
        const size = 18 + ratio * 54; // 18px ~ 72px
        span.style.fontSize = `${size}px`;
        span.style.color = PALETTE[i % PALETTE.length];
        span.textContent = word;
        span.title = `${count} 次`;
        cloudEl.appendChild(span);
      });
    });
  </script>
</body>
</html>
