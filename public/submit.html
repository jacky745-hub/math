<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>即時文字雲 - 投稿</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    padding: 32px 28px;
    width: min(420px, 90vw);
  }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p.hint { margin: 0 0 20px; color: #666; font-size: 14px; }
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
  }
  input[type="text"]:focus { border-color: #4285f4; }
  button {
    margin-top: 14px;
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: #4285f4;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button:disabled { background: #a9c2f0; cursor: default; }
  .status { margin-top: 12px; font-size: 14px; min-height: 20px; }
  .status.ok { color: #1a7f37; }
  .status.err { color: #c62828; }
</style>
</head>
<body>
  <div class="card">
    <h1>輸入一個詞</h1>
    <p class="hint">送出後會馬上出現在展示頁的文字雲上</p>
    <input id="word" type="text" maxlength="20" placeholder="例如：分數" autocomplete="off" />
    <button id="submitBtn">送出</button>
    <div class="status" id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const input = document.getElementById("word");
    const btn = document.getElementById("submitBtn");
    const status = document.getElementById("status");

    async function submitWord() {
      const word = input.value.trim();
      if (!word) return;

      btn.disabled = true;
      status.textContent = "";
      status.className = "status";

      try {
        await addDoc(collection(db, "wordcloud_words"), {
          word,
          created_at: serverTimestamp(),
        });
        input.value = "";
        status.textContent = "已送出！";
        status.className = "status ok";
      } catch (err) {
        status.textContent = "送出失敗，請稍後再試";
        status.className = "status err";
        console.error(err);
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    btn.addEventListener("click", submitWord);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitWord();
    });
  </script>
</body>
</html>
